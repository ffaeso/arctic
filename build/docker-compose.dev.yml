services:
  postgres:
    image: postgres:17-alpine
    container_name: arctic-postgres
    environment:
      POSTGRES_USER: arctic
      POSTGRES_PASSWORD: arctic
      POSTGRES_DB: arctic_dev
    ports:
      - "5432:5432"
    volumes:
      - arctic-postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arctic -d arctic_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  arctic-postgres-dev-data:
